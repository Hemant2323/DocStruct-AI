[project]
name = "docstruct-ai-backend"
version = "0.1.0"
description = "DocStruct AI — AI-powered document intelligence and structuring platform (backend)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    # --- Ingestion (Milestone 2) ---------------------------------------------
    # Required by FastAPI to accept multipart file uploads.
    "python-multipart>=0.0.20",
    # PDF text + tables. One engine for the format, deliberately not paired with
    # pypdf: two PDF engines would be the overlap CLAUDE.md warns against.
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # read_only/data_only streaming keeps memory bounded on large workbooks.
    "openpyxl>=3.1",
    # Text files are often cp1252, not UTF-8; guessing wrong produces mojibake
    # that silently poisons every downstream summary.
    "charset-normalizer>=3.4",
    # --- AI (Milestone 3) ------------------------------------------------------
    # The official Anthropic SDK. Never an OpenAI-compatible shim or raw HTTP
    # (CLAUDE.md §5).
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting (replaces flake8 + isort + black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (likely bugs)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern syntax)
    "ASYNC",# flake8-async (async correctness)
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no stray print statements)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "B008",  # function call in default argument — required by FastAPI's Depends()
]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert (S101) and hardcoded throwaway values (S105/S106).
"tests/**/*.py" = ["S101", "S105", "S106"]
# Alembic templates are generated; migrations are intentionally verbose.
"alembic/**/*.py" = ["I001"]
# The normalizer's translation table is *made of* look-alike characters — flagging them
# as ambiguous flags the feature itself.
"app/ingestion/normalizer.py" = ["RUF001"]
# citations.py folds smart punctuation so a genuine quote is not rejected over a
# typographic difference. The look-alike characters are the feature.
"app/ai/citations.py" = ["RUF001"]
# Tests deliberately contain smart quotes, ligatures and zero-width characters as inputs.
"tests/unit/test_normalizer_and_chunker.py" = ["RUF001", "S101"]
# Deliberately contains smart punctuation as test input for quote verification.
"tests/unit/test_context_and_citations.py" = ["RUF001", "S101"]
# A generator script run by hand; printing what it wrote is its whole user interface.
"tests/fixtures/make_pdf_fixtures.py" = ["T201"]
# Manual verification is run by hand and reports what the real API returned; printing
# that is the whole point of the file.
"tests/manual/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Without this, the local `alembic/` migrations directory makes ruff classify the
# installed `alembic` package as first-party and mis-sort its imports.
known-third-party = ["alembic"]

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
# These document-parsing libraries ship no type stubs. Silencing the missing-import
# error is preferable to adding stub packages we would then have to keep in step, and
# preferable to weakening strictness anywhere else: our own code stays fully checked,
# and the untyped boundary is confined to these imports.
module = [
    "pdfplumber.*",
    "pdfminer.*",
    "openpyxl.*",
    "docx.*",
    "charset_normalizer.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `-m "not live"` excludes tests that call real external services. They cost money and
# are non-deterministic, so they are opt-in only: `pytest -m live`.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: tests that call real external services (never run in CI)",
]
