# Alembic configuration.
#
# Note: sqlalchemy.url is intentionally NOT set here. The database URL is a secret in
# production (it contains credentials) and is read from the DATABASE_URL environment
# variable by alembic/env.py. Never commit a real connection string to this file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Migration filenames are prefixed with a timestamp so they sort chronologically.
# `timezone` is deliberately unset: it would require the `tzdata` package on Windows,
# which is not worth a dependency just to format a filename.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# No post-write hook. Formatting a freshly generated migration would require pointing
# alembic at the ruff binary inside the virtualenv, which is a machine-specific absolute
# path and not portable across contributors. `ruff format .` (part of the standard check
# sequence in the README) covers alembic/versions/ along with everything else.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
